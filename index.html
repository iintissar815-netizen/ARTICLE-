<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RUPTURE INARA</title><style>body{margin:0;font-family:sans-serif;background:#0f0f0f;color:#fff;direction:rtl}.header{background:#151515;padding:14px;display:flex;justify-content:space-between;border-bottom:2px solid #FF6600}.logo{color:#FF6600;font-weight:900;font-size:22px}#videoWrap{width:100%;height:42vh;background:#000;position:relative}.frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:230px;height:230px;border:3px solid #FF6600;border-radius:12px}.btn{background:#FF6600;color:#fff;border:none;width:94%;margin:12px 3%;padding:14px;font-size:17px;font-weight:900;border-radius:12px}.card{background:#1e1e1e;border-right:5px solid #00b4a0;border-radius:14px;padding:12px;margin:10px;display:flex;justify-content:space-between}.badge{background:#00b4a0;padding:5px 12px;border-radius:20px;font-size:11px}</style></head><body><div class="header"><div class="logo">⚡ RUPTURE</div><div>INARA • بلا خريطة</div></div><div id="videoWrap"><video id="video" autoplay playsinline></video><div class="frame"></div></div><button class="btn" onclick="startScan()">📷 مسح الباركود بالكاميرا</button><div id="products" style="padding:12px"></div><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>let db=JSON.parse(localStorage.getItem('inara_db')||'[]');function startScan(){const qr=new Html5Qrcode("videoWrap");qr.start({facingMode:"environment"},{fps:10,qrbox:230},(txt)=>{qr.stop();db.push({code:txt,name:"منتج INARA "+txt,mamar:"ممر المشروبات",raf:"رف C"});localStorage.setItem('inara_db',JSON.stringify(db));render();});}function render(){let h="";db.slice().reverse().forEach(i=>{h+=`<div class="card"><div><h4>${i.name}</h4><p>الممر: ${i.mamar} • الرف: ${i.raf} • ${i.code}</p></div><div class="badge">متوفر</div></div>`});document.getElementById('products').innerHTML=h||'<p style="text-align:center;color:#666">لا يوجد منتجات</p>';}render();</script></body></html>
